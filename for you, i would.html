<!DOCTYPE html>
<html>
<head>
    <title>I Miss You</title>
    <link rel="stylesheet" href="missu.css">
</head>

<body>

    <div class="container">

        <h1>For you ♡</h1>

        <div class="envelope" onclick="openEnvelope()">

            <div class="letter">
                <h2>I MISS YOU</h2>

        }
    </script>

</body>
</html>
